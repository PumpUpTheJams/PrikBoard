name: VS Code extension

# The extension is released on its own, apart from the app: pushing a tag vscode-1.2.3 packages it with version 1.2.3 and
# publishes the .vsix as its own GitHub release, "PrikBoard for VS Code 1.2.3", which never becomes the repository's
# latest release (that stays the app's). A release drafted on GitHub for such a tag gets the .vsix attached instead.
# The same .vsix is also pushed to the GitHub Container Registry as an OCI artifact, ghcr.io/<owner>/prikboard-vscode:1.2.3
# and :latest, so the repository's Packages list shows the extension next to the app's image. Its
# org.opencontainers.image.source annotation links the package to this repository; a new package may still need its
# visibility set to public once (Package settings). App tags (1.2.3) only build the container image (containers.yml).
# Pull requests are covered by the vscode job in ci.yml.
on:
  push:
    tags: ['vscode-[0-9]+.[0-9]+.[0-9]+']

jobs:
  vsix:
    name: Package and release .vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json
      - run: echo "VERSION=${GITHUB_REF_NAME#vscode-}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --production
      # The tag is the version. --no-update-package-json keeps the checked-out package.json as it is.
      - run: >-
          npx vsce package "$VERSION"
          --no-dependencies --skip-license --allow-missing-repository
          --no-git-tag-version --no-update-package-json
          --out "prikboard-vscode-$VERSION.vsix"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          file="prikboard-vscode-$VERSION.vsix"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$file" \
              --title "PrikBoard for VS Code $VERSION" \
              --latest=false \
              --notes "The PrikBoard extension for VS Code, version $VERSION. To install it, download $file and run **Extensions: Install from VSIX...** from the command palette, or \`code --install-extension $file\`."
          fi
      - uses: oras-project/setup-oras@v1
      - name: Push to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="prikboard-vscode-$VERSION.vsix"
          # ghcr.io only takes lower-case names.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prikboard-vscode"
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "$image:$VERSION,latest" \
            --artifact-type application/vnd.prikboard.vscode-extension \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=PrikBoard for VS Code. Install the .vsix with: oras pull $image:$VERSION && code --install-extension $file" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            "$file:application/zip"
