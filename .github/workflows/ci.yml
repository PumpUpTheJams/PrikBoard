name: CI

on:
  pull_request:

# Pull requests can come from forks, so CI only reads the repository.
permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    services:
      # Same credentials as compose.yaml, which the test factory uses by default.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prikboard
          POSTGRES_PASSWORD: prikboard
          POSTGRES_DB: prikboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prikboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # The NuGet packages, until a project's package references change. setup-dotnet's own cache needs lock files.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet test --solution PrikBoard.slnx

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  vscode:
    name: VS Code extension lint, build and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run package

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so a secret added and removed again within the pull request is still found.
          fetch-depth: 0
      # The gitleaks binary rather than gitleaks-action, which needs a paid license on organization repositories.
      - run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose
