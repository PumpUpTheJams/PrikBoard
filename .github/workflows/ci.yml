name: CI

on:
  pull_request:
  # Also on main, so its caches exist: a pull request can only restore caches from its own runs and from its base branch.
  push:
    branches: [main]

# Pull requests can come from forks, so CI only reads the repository.
permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      # Not a service container, which pulls and starts before the first step (about 20 s): it starts in the background
      # while the build runs. Same credentials as compose.yaml, which the test factory uses by default.
      - name: Start PostgreSQL
        run: >-
          nohup docker run -d --name postgres -p 127.0.0.1:5432:5432
          -e POSTGRES_USER=prikboard -e POSTGRES_PASSWORD=prikboard -e POSTGRES_DB=prikboard
          postgres:17 > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # The NuGet packages, until a project's package references change. setup-dotnet's own cache needs lock files.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # Separate steps, so the job's timings show where the time goes.
      - run: dotnet restore PrikBoard.slnx
      - run: dotnet build PrikBoard.slnx --no-restore
      # Over TCP: during its first start the image runs a temporary server on the socket only, which then restarts.
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U prikboard && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres.log"
          exit 1
      # The test program itself, which skips the solution evaluation `dotnet test` does first (about 2 s).
      - run: src/PrikBoard.Api.Tests/bin/Debug/net10.0/PrikBoard.Api.Tests

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  vscode:
    name: VS Code extension lint, build and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run package

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so a secret added and removed again within the pull request is still found.
          fetch-depth: 0
      # The gitleaks binary rather than gitleaks-action, which needs a paid license on organization repositories.
      - run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose
