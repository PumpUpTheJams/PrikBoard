name: Containers

# Pushing a semver tag (1.2.3) builds the API and web images and publishes them to the GitHub Container Registry as
# ghcr.io/<owner>/prikboard-api:1.2.3 and prikboard-web:1.2.3. Pull requests don't build images.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  image:
    name: ${{ matrix.image }} image
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: prikboard-api
            context: src/PrikBoard.Api
          - image: prikboard-web
            context: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
