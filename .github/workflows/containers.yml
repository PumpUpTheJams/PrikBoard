name: Containers

# Pushing a semver tag (1.2.3) builds the PrikBoard image (the API serving the web app, see the root Dockerfile) and
# publishes it to the GitHub Container Registry as ghcr.io/<owner>/prikboard:1.2.3 and :latest, for linux/amd64 and
# linux/arm64 (Raspberry Pi). Pull requests don't build images.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  image:
    name: prikboard image
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/prikboard
          tags: type=semver,pattern={{version}}
          # infra/compose/compose.yaml uses latest unless PRIKBOARD_VERSION says otherwise.
          flavor: latest=true
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile cross-compiles on the runner's own platform, so arm64 needs no QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # No build cache: exporting it to the GitHub Actions cache took 2-3 minutes per image, longer than the build
          # itself, and builds never hit it.
