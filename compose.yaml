# Local development database. Start with `docker compose up -d`; data lives in the `postgres-data` volume and
# survives `docker compose down` (only `docker compose down -v` deletes it). The fixed project name makes every
# checkout and worktree share this one database instead of starting another on the same port.
name: prikboard
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: prikboard
      POSTGRES_PASSWORD: prikboard
      POSTGRES_DB: prikboard
    # Only this machine can reach it: the password is the same in every checkout.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prikboard -d prikboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
