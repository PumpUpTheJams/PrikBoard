# Local development database. Start with `docker compose up -d`; data lives in the `postgres-data` volume and
# survives `docker compose down` (only `docker compose down -v` deletes it).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: prikboard
      POSTGRES_PASSWORD: prikboard
      POSTGRES_DB: prikboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prikboard -d prikboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The Discord bot (docs/discord.md), only with `docker compose --profile discord up -d`. It needs a bot token
  # (DISCORD_BOT_TOKEN) and the API running on the host (dotnet run --project src/PrikBoard.Api). Discord can only
  # show previews whose links people can open, so PRIKBOARD_PUBLIC_URL must match the API's Discord:PublicUrl.
  # Compose reads every service's variables, profile or not, so the token isn't required here (that would stop a plain
  # `docker compose up -d`): without it the bot stops at startup and says so in `docker compose logs discord`.
  discord:
    profiles: [discord]
    build: src/PrikBoard.Discord
    environment:
      Discord__BotToken: ${DISCORD_BOT_TOKEN:-}
      PrikBoard__ApiUrl: http://host.docker.internal:5080
      PrikBoard__PublicUrl: ${PRIKBOARD_PUBLIC_URL:-http://localhost:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - discord-data:/home/app/data
    restart: unless-stopped

volumes:
  postgres-data:
  discord-data:
