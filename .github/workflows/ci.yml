name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    services:
      # Same credentials as compose.yaml, which the test factory uses by default.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prikboard
          POSTGRES_PASSWORD: prikboard
          POSTGRES_DB: prikboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prikboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test PrikBoard.slnx

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  vscode:
    name: VS Code extension lint, build and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run package
