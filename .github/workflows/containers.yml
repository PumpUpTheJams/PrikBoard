name: Containers

# Pushing a semver tag (1.2.3) builds the API and web images and publishes them to the GitHub Container Registry as
# ghcr.io/<owner>/prikboard-api:1.2.3 and prikboard-web:1.2.3, for linux/amd64 and linux/arm64 (Raspberry Pi).
# Pull requests don't build images.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  image:
    name: ${{ matrix.image }} image
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: prikboard-api
            context: src/PrikBoard.Api
          - image: prikboard-web
            context: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # The Dockerfiles cross-compile on the runner's own platform, so arm64 needs no QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # No build cache: exporting it to the GitHub Actions cache took 2-3 minutes per image, longer than the build
          # itself, and builds never hit it.
