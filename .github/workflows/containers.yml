name: Containers

# Pushing a semver tag (1.2.3) builds the PrikBoard image (the API serving the web app, see the root Dockerfile) and
# publishes it to the GitHub Container Registry as ghcr.io/<owner>/prikboard:1.2.3 and :latest, for linux/amd64 and
# linux/arm64 (Raspberry Pi). Pull requests don't build images. The package must give this repository Write access
# (its Package settings -> Manage Actions access), or the push is refused with 403.
# It also goes to Docker Hub as <DOCKERHUB_USERNAME>/prikboard when the repository variable DOCKERHUB_USERNAME (the user
# or organization on Docker Hub) and the secret DOCKERHUB_TOKEN (a personal access token with Read & Write) are set;
# without them only ghcr.io gets it. The Docker Hub repository is created on the first push, public by default.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  image:
    name: prikboard image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/prikboard
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/prikboard,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: type=semver,pattern={{version}}
          # infra/compose/compose.yaml uses latest unless PRIKBOARD_VERSION says otherwise.
          flavor: latest=true
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile cross-compiles on the runner's own platform, so arm64 needs no QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # No build cache: exporting it to the GitHub Actions cache took 2-3 minutes per image, longer than the build
          # itself, and builds never hit it.
