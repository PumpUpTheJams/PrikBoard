name: VS Code extension

# Pushing a semver tag (1.2.3) packages the VS Code extension with that version and attaches the .vsix to the run as an
# artifact (Actions -> the run -> Artifacts). Pull requests are covered by the vscode job in ci.yml.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  vsix:
    name: Package .vsix
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --production
      # The tag is the version. --no-update-package-json keeps the checked-out package.json as it is.
      - run: >-
          npx vsce package "${{ github.ref_name }}"
          --no-dependencies --skip-license --allow-missing-repository
          --no-git-tag-version --no-update-package-json
          --out "prikboard-vscode-${{ github.ref_name }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: prikboard-vscode-${{ github.ref_name }}
          path: src/vscode/prikboard-vscode-${{ github.ref_name }}.vsix
          if-no-files-found: error
